# Tommy's Bus — local services.
#   Database only (default):   podman compose -f infra/compose.yaml up -d db
#   Full stack in containers:  podman compose -f infra/compose.yaml --profile full up -d --build
name: tommysbus

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tommysbus}
      POSTGRES_USER: ${POSTGRES_USER:-tommysbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tommysbus_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: ../apps/api
    env_file: ../.env
    environment:
      SEED_DEMO_DATA: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://${POSTGRES_USER:-tommysbus}:${POSTGRES_PASSWORD:-tommysbus_dev_only}@db:5432/${POSTGRES_DB:-tommysbus}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["full"]
    build:
      context: ../apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
